[workspace]
resolver = "2"
members = [
    "crates/xcom-client",
    "crates/xcom-codec",
    "crates/xcom-proto",
    "crates/xcom-transport",
    "crates/xcom-x11",
    "crates/xcom-server",
]

[workspace.package]
version = "0.2.2"
edition = "2021"
license = "MIT OR Apache-2.0"

[workspace.dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
libc = "0.2"
lz4_flex = "0.11"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
socket2 = "0.5"
x11rb = { version = "0.13", features = ["composite", "damage", "shm", "xfixes", "xtest"] }

# Local release builds keep debug info for usable backtraces. Shipping
# artifacts strip it: scripts/build-static.sh passes
# CARGO_PROFILE_RELEASE_DEBUG=false and STRIP=debuginfo; build-windows.sh sets
# DEBUG=false (PE debug info would otherwise be a ~37 MB .pdb).
[profile.release]
debug = true

# Fully stripped, LTO'd build for a small Linux client:
#   cargo build --profile dist -p xcom-client
[profile.dist]
inherits = "release"
debug = false
strip = "symbols"
lto = "thin"
codegen-units = 1
