[package]
name = "xcom-server"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "xcom session daemon (xcomd)"

[[bin]]
name = "xcomd"
path = "src/main.rs"

[features]
# The M0 spike harness (anim, wm-demo, selftest, sink) is a development tool.
# On by default so the dev loop and the e2e scripts can use `xcomd m0`; the
# shipping artifact is built with --no-default-features.
default = ["m0"]
m0 = []

[dependencies]
anyhow = { workspace = true }
clap = { workspace = true }
libc = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
x11rb = { workspace = true }
xcom-codec = { path = "../xcom-codec" }
xcom-proto = { path = "../xcom-proto" }
xcom-transport = { path = "../xcom-transport" }
xcom-x11 = { path = "../xcom-x11" }
