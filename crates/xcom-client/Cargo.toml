[package]
name = "xcom-client"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "xcom client: renders remote X windows as native windows"

[[bin]]
name = "xcom"
path = "src/main.rs"

[dependencies]
anyhow = { workspace = true }
clap = { workspace = true }
raw-window-handle = "0.6"
softbuffer = "0.4"
winit = "0.30"
xcom-codec = { path = "../xcom-codec" }
xcom-proto = { path = "../xcom-proto" }
xcom-transport = { path = "../xcom-transport" }
