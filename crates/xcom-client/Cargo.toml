[package]
name = "xcom-client"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "xcom client: renders remote X windows as native windows"

[[bin]]
name = "xcom"
path = "src/main.rs"

[dependencies]
arboard = { version = "3", default-features = false }
anyhow = { workspace = true }
clap = { workspace = true }
raw-window-handle = "0.6"
serde_json = { workspace = true }
softbuffer = "0.4"
winit = "0.30"
xcom-codec = { path = "../xcom-codec" }
xcom-proto = { path = "../xcom-proto" }
xcom-transport = { path = "../xcom-transport" }

[target.'cfg(target_os = "linux")'.dependencies]
# Only the XFixes selection notifications are needed for clipboard mirroring.
x11rb = { version = "0.13", features = ["xfixes"] }

[target.'cfg(windows)'.dependencies]
# GetClipboardSequenceNumber: change detection without touching the clipboard.
# GetSystemMetrics: session display size from the monitor layout.
windows-sys = { version = "0.61", features = [
    "Win32_System_DataExchange",
    "Win32_UI_WindowsAndMessaging",
] }
